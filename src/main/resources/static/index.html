<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowAI - AI 流程图生成器</title>
    <!-- CSS 拆出去，HTML 只管结构 -->
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

<!-- Vue 挂载点：#app 内的所有内容由 Vue 接管 -->
<div id="app">

    <!-- ===== 左侧边栏 ===== -->
    <aside class="sidebar">
        <div class="brand">
            <span>⚡</span>
            <div>FlowAI <span>流程图</span></div>
        </div>

        <nav class="nav-section">
            <div class="nav-item active">
                <span>➕</span> 新建流程图
            </div>
            <div class="nav-item" @click="showToast('历史记录功能开发中')">
                <span>🕘</span> 历史记录
            </div>
            <div class="nav-item" @click="showToast('模板中心开发中')">
                <span>📁</span> 模板中心
            </div>
            <div class="nav-divider"></div>
            <div class="nav-item" @click="showToast('设置功能开发中')">
                <span>⚙️</span> 设置
            </div>
        </nav>

        <div class="sidebar-footer">
            <div class="theme-toggle" @click="toggleTheme">
                <span>{{ theme === 'dark' ? '☀️ 浅色模式' : '🌙 深色模式' }}</span>
            </div>
            <div class="nav-item">
                <span>👤</span> 未登录
            </div>
        </div>
    </aside>

    <!-- ===== 主区域：右侧全部工作区 ===== -->
    <main class="main">

        <!-- 顶栏：标题 + 图表类型 -->
        <div class="top-bar">
            <div class="top-bar-left">
                <h1>FlowAI</h1>
                <span class="subtitle">帮你画流程图</span>
            </div>
            <div class="type-chips">
                <!-- 三种类型都能点了：点击设置 chartType，:class 根据值高亮 -->
                <div class="chip" :class="{ active: chartType === 'flowchart' }"
                     @click="setChartType('flowchart')">🔄 流程图</div>
                <div class="chip" :class="{ active: chartType === 'mindmap' }"
                     @click="setChartType('mindmap')">🧠 思维导图</div>
                <div class="chip" :class="{ active: chartType === 'architecture' }"
                     @click="setChartType('architecture')">🏗️ 架构图</div>
            </div>
        </div>

        <!-- 画布区：显示图形（在输入框上面，占满剩余空间） -->
        <div class="canvas-area">

            <!-- 空状态：没有结果时显示（文案跟着图表类型变） -->
            <div class="empty-state" v-if="!hasResult && !errorMessage">
                <div class="icon">📊</div>
                <p>输入描述后点击"{{ buttonText }}"</p>
            </div>

            <!-- 错误提示 -->
            <div class="error-msg" v-if="errorMessage">{{ errorMessage }}</div>

            <!-- SVG 视口：有结果时显示，支持滚轮缩放 + 拖拽 -->
            <div class="svg-viewport" v-if="hasResult"
                 @wheel.prevent="onWheel"
                 @mousedown="onMouseDown"
                 @mousemove="onMouseMove"
                 @mouseup="onMouseUp"
                 @mouseleave="onMouseUp">
                <!-- v-html：把后端返回的 SVG 字符串当 HTML 渲染 -->
                <!-- :style：缩放和拖拽通过 transform 实现，值变了自动更新 -->
                <div class="svg-wrapper"
                     :style="{ transform: 'translate(' + translateX + 'px, ' + translateY + 'px) scale(' + scale + ')' }"
                     v-html="svgContent"></div>
            </div>

            <!-- 画布工具栏（浮在画布右上角） -->
            <div class="canvas-toolbar" v-if="hasResult">
                <div class="zoom-controls">
                    <button class="tool-btn" @click="zoomIn">➕</button>
                    <button class="tool-btn" @click="zoomOut">➖</button>
                    <button class="tool-btn" @click="resetZoom">⟲</button>
                    <span class="zoom-label">{{ Math.round(scale * 100) }}%</span>
                </div>
                <div class="download-group">
                    <button class="tool-btn btn-svg" @click="downloadFile('svg')">⬇️ SVG</button>
                    <button class="tool-btn btn-png" @click="downloadFile('png')">⬇️ PNG</button>
                </div>
            </div>
        </div>

        <!-- 输入区（底部固定，像聊天框） -->
        <div class="input-area">
            <div class="input-card">
                <div class="input-toolbar">
                    <span class="mini-tag" @click="fillExample('登录')">🔐 登录流程</span>
                    <span class="mini-tag" @click="fillExample('审批')">📋 审批流程</span>
                    <span class="mini-tag" @click="fillExample('电商')">🧠 电商组成</span>
                    <span class="mini-tag" @click="fillExample('系统架构')">🏗️ 系统架构</span>
                </div>
                <!-- v-model：双向绑定，输入框内容 ↔ textInput 变量 -->
                <!-- @keydown.ctrl.enter：Ctrl+Enter 快捷发送 -->
                <!-- :placeholder：占位符按图表类型动态切换 -->
                <textarea v-model="textInput"
                    @keydown.ctrl.enter="generate"
                    :placeholder="placeholderText"></textarea>
                <div class="input-footer">
                    <select class="model-select" v-model="selectedModel" @change="onModelChange">
                        <option value="kimi">Kimi K2.5</option>
                        <option value="gemini">Gemini Flash</option>
                        <option value="deepseek">DeepSeek</option>
                    </select>
                    <button class="send-btn" @click="generate" :disabled="loading">
                        <span>{{ loading ? '⏳' : '⚡' }}</span>
                        {{ loading ? '生成中...' : buttonText }}
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Toast 轻提示 -->
    <div class="toast" :class="{ show: toastVisible }">{{ toastMsg }}</div>

</div>

<!-- Vue 3 CDN（global build，不用 npm） -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<!-- JS 逻辑拆出去 -->
<script src="app.js"></script>
</body>
</html>
