# ChartFlow · CI 门禁（GitHub Actions）
#
# 作用：把 run-verify.ps1 的三步门禁搬到 GitHub 服务器上，提交即自动跑。
# 定位：本文件与 workbuddyFlow/run-verify.ps1 是【同一套门禁的两个执行器】，
#       步骤严格一一对应，改任一处必须同步另一处：
#         run-verify [1/3] mvn clean test          <-> backend / 后端编译 + 单测
#         run-verify [2/3] npm ci + build + lint   <-> frontend / 安装 + 构建 + 规范
#         run-verify [3/3] mvn checkstyle:check    <-> backend / 后端规范检查
#       唯一有意差异：CI 用 npm ci（严格按 lockfile），本地默认 npm install（增量、快）。
# 注：CI 跑在原生 Ubuntu bash 上，不存在本机 Git Bash 的 MSYS 路径转换问题，mvn 可直接使用。

name: CI

on:
  push:                 # 所有分支的提交都触发（含 reframing 等特性分支）
  pull_request:
    branches: [ main ]  # 只有指向 main 的 PR 才触发

permissions:
  contents: read        # 最小权限：CI 只需要读代码

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # 同一分支连续提交时，自动取消上一次没跑完的运行

jobs:
  backend:
    name: 后端 · 编译 + 单测 + 规范
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven        # 缓存 ~/.m2/repository，key 由 pom.xml 哈希决定

      - name: 后端编译 + 单测（对应 run-verify 1/3）
        run: mvn -B clean test

      - name: 后端规范检查 checkstyle（对应 run-verify 3/3）
        run: mvn -B checkstyle:check

  frontend:
    name: 前端 · 安装 + 构建 + 规范
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（对应 run-verify 2/3，CI 严格按 lockfile）
        run: npm ci

      - name: 构建（build 脚本内含 tsc 类型检查）
        run: npm run build

      - name: 前端规范检查 eslint（对应 run-verify 2/3）
        run: npm run lint
