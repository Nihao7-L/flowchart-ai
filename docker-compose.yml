# ===== Docker Compose：一条命令启动完整服务 =====
#
# 使用方式：
#   1. 准备配置：cp src/main/resources/application-example.yml src/main/resources/application.yml
#      并填入你的真实 Key（application.yml 已被 .gitignore 与 .dockerignore 排除，不会泄露）
#   2. 启动：docker compose up --build -d
#   3. 停止：docker compose down
#
# 安全说明：配置通过「挂载卷」注入容器，运行时读取，绝不烤进镜像层。
#           （.dockerignore 也已排除 application.yml，双保险）

services:
  flowai:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # 挂本地配置（含 Key），容器启动时读取；不写进镜像
      - ./src/main/resources/application.yml:/app/application.yml:ro
    restart: unless-stopped
